server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: agripulse-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agripulse}
    username: ${DB_USER:agripulse}
    password: ${DB_PASSWORD:agripulse_secure_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# JWT Security
agripulse:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

# SpringDoc OpenAPI Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
