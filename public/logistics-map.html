<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Logistics Live Map | Uzhavan Connect</title>

  <!-- Leaflet.js CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #01472e;
      --primary-dark: #013623;
      --accent: #2563eb;
      --pending: #f97316;
      --in-transit: #3b82f6;
      --delivered: #10b981;
      --bg-glass: rgba(255, 255, 255, 0.94);
      --border: rgba(226, 232, 240, 0.9);
      --text: #0f172a;
      --text-muted: #64748b;
      --shadow: 0 12px 32px -4px rgba(0, 0, 0, 0.14), 0 4px 12px -2px rgba(0, 0, 0, 0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    body { font-family: 'Inter', system-ui, sans-serif; color: var(--text); background: #f8fafc; overflow: hidden; }
    #map { height: 100vh; width: 100vw; z-index: 1; }

    /* Control Panel */
    .control-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1000;
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px 18px;
      width: 310px;
      max-width: calc(100vw - 32px);
      box-shadow: var(--shadow);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
    }
    .panel-header h3 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .live-dot {
      width: 8px; height: 8px; background: var(--delivered); border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Telemetry Pill */
    .telemetry-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 12px;
      font-size: 11.5px;
      color: #166534;
      font-weight: 600;
    }
    .telemetry-item { display: flex; align-items: center; gap: 5px; }

    /* Filter Counters */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .stat-badge {
      padding: 7px 6px;
      border-radius: 10px;
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: all 0.15s;
    }
    .stat-badge:hover { transform: translateY(-1px); }
    .stat-badge.selected { border-color: currentColor; }
    .stat-pending { background: #fff7ed; color: #c2410c; }
    .stat-transit { background: #eff6ff; color: #1d4ed8; }
    .stat-delivered { background: #ecfdf5; color: #047857; }
    .stat-val { font-size: 15px; font-weight: 700; display: block; }

    /* Button Group */
    .btn-group { display: flex; flex-direction: column; gap: 6px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background: #ffffff;
      color: #334155;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { background: #f8fafc; border-color: #cbd5e1; }
    .btn.active { background: #0f172a; color: #ffffff; border-color: #0f172a; }
    .btn-pill {
      font-size: 10px; padding: 2px 6px; border-radius: 12px; background: #f1f5f9; color: #64748b; font-weight: 700;
    }
    .btn.active .btn-pill { background: rgba(255,255,255,0.22); color: #fff; }

    .btn-recenter {
      background: var(--primary) !important;
      color: #fff !important;
      border-color: var(--primary) !important;
      justify-content: center;
      gap: 6px;
      margin-top: 4px;
    }
    .btn-recenter:hover { background: var(--primary-dark) !important; }

    /* Custom Markers */
    .depot-marker {
      background: #01472e; color: #fff; width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 3px solid #fff; box-shadow: 0 4px 14px rgba(1, 71, 46, 0.45);
      cursor: pointer; transition: transform 0.2s;
    }
    .depot-marker:hover { transform: scale(1.15); }

    .delivery-marker {
      width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid #fff;
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; box-shadow: 0 3px 10px rgba(0,0,0,0.25);
      cursor: pointer; transition: transform 0.2s;
    }
    .delivery-marker:hover { transform: scale(1.2); }
    .delivery-marker.pending { background: var(--pending); }
    .delivery-marker.in-transit {
      background: var(--in-transit);
      animation: transitPulse 2s infinite;
    }
    .delivery-marker.delivered { background: var(--delivered); }

    @keyframes transitPulse {
      0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.6); }
      70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }

    /* Live Vehicle Marker */
    .truck-marker {
      background: #0f172a;
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #38bdf8; border: 3px solid #ffffff;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.5);
      transition: transform 0.3s ease-out;
    }

    /* Popups */
    .leaflet-popup-content-wrapper {
      border-radius: 14px; padding: 4px; font-family: 'Inter', sans-serif;
      box-shadow: 0 12px 28px -4px rgba(0,0,0,0.18); border: 1px solid #e2e8f0;
    }
    .leaflet-popup-content { margin: 10px 12px; line-height: 1.4; }
    .popup-title { font-size: 13.5px; font-weight: 700; color: #0f172a; }
    .popup-desc { font-size: 11.5px; color: #64748b; margin: 3px 0 6px; }
    .popup-badge {
      display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px;
      border-radius: 6px; text-transform: uppercase;
    }
    .popup-badge.pending { background: #ffedd5; color: #c2410c; }
    .popup-badge.in-transit { background: #dbeafe; color: #1d4ed8; }
    .popup-badge.delivered { background: #dcfce7; color: #15803d; }
    .popup-badge.warehouse { background: #ecfdf5; color: #01472e; border: 1px solid #a7f3d0; }
    .popup-meta {
      font-size: 11px; color: #475569; margin-top: 6px; padding-top: 5px;
      border-top: 1px dashed #e2e8f0; display: flex; justify-content: space-between;
    }

    @media (max-width: 640px) {
      .control-panel { top: auto; bottom: 16px; right: 12px; left: 12px; width: auto; padding: 14px; }
    }
  </style>
</head>
<body>

  <div id="map" role="application"></div>

  <!-- Control Panel -->
  <aside class="control-panel">
    <div class="panel-header">
      <h3>
        <span class="live-dot" title="Active Fleet Telemetry"></span>
        Logistics Live Map
      </h3>
      <span style="font-size: 11px; font-weight: 700; color: #0284c7;">OSRM Live</span>
    </div>

    <!-- Live Telemetry Banner -->
    <div class="telemetry-bar">
      <div class="telemetry-item">
        <span>🚚 Reefer #DL-9C</span>
      </div>
      <div class="telemetry-item">
        <span>❄️ 3.8°C</span>
        <span style="color:#10b981;">• OK</span>
      </div>
      <div class="telemetry-item">
        <span id="speedDisplay">42 km/h</span>
      </div>
    </div>

    <!-- Status Filter Badges -->
    <div class="stats-grid">
      <div class="stat-badge stat-pending" data-filter="pending" title="Filter Pending">
        <span class="stat-val" id="countPending">0</span>
        Pending
      </div>
      <div class="stat-badge stat-transit" data-filter="in-transit" title="Filter In Transit">
        <span class="stat-val" id="countTransit">0</span>
        In Transit
      </div>
      <div class="stat-badge stat-delivered" data-filter="delivered" title="Filter Delivered">
        <span class="stat-val" id="countDelivered">0</span>
        Delivered
      </div>
    </div>

    <!-- Layer Toggles -->
    <div class="btn-group">
      <button type="button" class="btn active" id="toggleWarehouse">
        <span>🏢 Central Cold Depot</span>
        <span class="btn-pill" id="badgeWarehouse">ON</span>
      </button>

      <button type="button" class="btn active" id="toggleDeliveries">
        <span>📦 Delivery Points</span>
        <span class="btn-pill" id="badgeDeliveries">ON</span>
      </button>

      <button type="button" class="btn active" id="toggleRoute">
        <span>🛣️ OSRM Road Route</span>
        <span class="btn-pill" id="badgeRoute">ON</span>
      </button>

      <button type="button" class="btn btn-recenter" id="recenterBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="22" y1="12" x2="18" y2="12"></line>
          <line x1="6" y1="12" x2="2" y2="12"></line>
          <line x1="12" y1="6" x2="12" y2="2"></line>
          <line x1="12" y1="22" x2="12" y2="18"></line>
        </svg>
        Recenter Fleet Route
      </button>
    </div>
  </aside>

  <!-- Leaflet CDN -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <script>
    /**
     * Logistics Live Map - Production Grade Engine
     * - Uses CARTO Voyager tiles (Permits file:// & localhost without OSM 403 blocks)
     * - OSRM Turn-by-Turn Real Road Routing API
     * - Real-Time Animated Reefer Vehicle with Heading & Telemetry
     * - 200m Geofencing visualization
     */

    // 1. CONFIG & CARTO TILES (Reliable, high-speed, zero API key)
    const CONFIG = {
      center: [28.6139, 77.2090], // New Delhi
      zoom: 12,
      // CARTO Voyager tiles allow file://, localhost, and production without HTTP 403 blocks
      tileUrl: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>'
    };

    // 2. DATA
    const warehouse = {
      name: "North Hub – Delhi Central Cold Storage",
      lat: 28.6139,
      lng: 77.2090,
      capacity: "1,500 MT Reefer Capacity",
      manager: "Rajiv Sharma (+91 98110-23456)"
    };

    const deliveryPoints = [
      {
        id: "ORD-4821", customer: "Safal Agro Mart",
        address: "Connaught Place, New Delhi",
        lat: 28.6304, lng: 77.2177, status: "pending",
        cargo: "Hydroponic Tomatoes (120 kg)", eta: "18:45 IST"
      },
      {
        id: "ORD-4822", customer: "Nature's Basket Retail",
        address: "South Extension Part II, New Delhi",
        lat: 28.5672, lng: 77.2430, status: "in-transit",
        cargo: "Organic Strawberries (45 kg)", eta: "17:15 IST (En Route)"
      },
      {
        id: "ORD-4823", customer: "Metro Cash & Carry",
        address: "Rohini Sector 10, New Delhi",
        lat: 28.7041, lng: 77.1025, status: "delivered",
        cargo: "Red Onions (500 kg)", eta: "Completed at 14:20 IST"
      },
      {
        id: "ORD-4824", customer: "Blinkit Fulfillment Dark Store",
        address: "Sector 62, Noida",
        lat: 28.6255, lng: 77.3750, status: "pending",
        cargo: "Cavendish Bananas (200 kg)", eta: "19:30 IST"
      },
      {
        id: "ORD-4825", customer: "Zomato Hyperpure Warehouse",
        address: "Cyber City DLF Phase II, Gurugram",
        lat: 28.4895, lng: 77.0866, status: "in-transit",
        cargo: "Shimla Apples (350 kg)", eta: "17:40 IST"
      }
    ];

    // 3. MAP INIT
    const map = L.map('map', { zoomControl: true }).setView(CONFIG.center, CONFIG.zoom);
    L.tileLayer(CONFIG.tileUrl, {
      maxZoom: 19,
      subdomains: 'abcd',
      attribution: CONFIG.attribution
    }).addTo(map);
    map.zoomControl.setPosition('topleft');

    // 4. LAYERS
    const warehouseLayer = L.layerGroup().addTo(map);
    const deliveriesLayer = L.layerGroup().addTo(map);
    const routeLayer = L.layerGroup().addTo(map);
    const geofenceLayer = L.layerGroup().addTo(map);
    const vehicleLayer = L.layerGroup().addTo(map);

    // 5. ICONS
    const depotIcon = L.divIcon({
      className: 'depot-div-icon',
      html: `
        <div class="depot-marker" title="${warehouse.name}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M3 21h18"></path><path d="M3 7v14"></path><path d="M21 7v14"></path>
            <path d="M12 3L2 9h20l-10-6z"></path><path d="M9 13h6"></path>
          </svg>
        </div>
      `,
      iconSize: [38, 38], iconAnchor: [19, 19], popupAnchor: [0, -22]
    });

    function createDeliveryIcon(index, status) {
      return L.divIcon({
        className: 'delivery-div-icon',
        html: `<div class="delivery-marker ${status}">${index + 1}</div>`,
        iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -16]
      });
    }

    // 6. POPULATE WAREHOUSE
    L.marker([warehouse.lat, warehouse.lng], { icon: depotIcon })
      .bindPopup(`
        <div class="popup-title">${warehouse.name}</div>
        <div class="popup-desc">Central Reefer Logistics Depot</div>
        <span class="popup-badge warehouse">Central Hub</span>
        <div class="popup-meta"><span><strong>Capacity:</strong> ${warehouse.capacity}</span></div>
        <div class="popup-meta" style="border:none;"><span><strong>Dispatch:</strong> ${warehouse.manager}</span></div>
      `).addTo(warehouseLayer);

    // 7. POPULATE DELIVERIES & GEOFENCES
    let counts = { pending: 0, "in-transit": 0, delivered: 0 };
    const markerRegistry = [];

    deliveryPoints.forEach((point, idx) => {
      counts[point.status] = (counts[point.status] || 0) + 1;

      // 200m Geofence Circle
      const geofence = L.circle([point.lat, point.lng], {
        radius: 200,
        color: point.status === 'delivered' ? '#10b981' : '#3b82f6',
        weight: 1,
        fillColor: point.status === 'delivered' ? '#10b981' : '#3b82f6',
        fillOpacity: 0.08,
        dashArray: '4, 4'
      }).addTo(geofenceLayer);

      const marker = L.marker([point.lat, point.lng], {
        icon: createDeliveryIcon(idx, point.status)
      })
      .bindPopup(`
        <div class="popup-title">${point.customer}</div>
        <div class="popup-desc">${point.address}</div>
        <span class="popup-badge ${point.status}">${point.status.replace('-', ' ')}</span>
        <div class="popup-meta"><span><strong>Order:</strong> ${point.id}</span><span><strong>Stop:</strong> #${idx + 1}</span></div>
        <div class="popup-meta"><span><strong>Cargo:</strong> ${point.cargo}</span></div>
        <div class="popup-meta" style="color:#01472e; font-weight:700;"><span><strong>ETA:</strong> ${point.eta}</span></div>
      `).addTo(deliveriesLayer);

      markerRegistry.push({ point, marker, geofence });
    });

    document.getElementById('countPending').textContent = counts.pending;
    document.getElementById('countTransit').textContent = counts['in-transit'];
    document.getElementById('countDelivered').textContent = counts.delivered;

    // 8. TURN-BY-TURN ROAD ROUTING (Free OSRM API with Polyline Fallback)
    const stops = [
      [warehouse.lng, warehouse.lat],
      ...deliveryPoints.map(p => [p.lng, p.lat])
    ];
    const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${stops.map(s => s.join(',')).join(';')}?overview=full&geometries=geojson`;

    let activeRoutePath = [];

    fetch(osrmUrl)
      .then(res => res.json())
      .then(data => {
        if (data.routes && data.routes.length > 0) {
          const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
          drawRoute(coords, (data.routes[0].distance / 1000).toFixed(1), Math.round(data.routes[0].duration / 60));
          startVehicleSimulation(coords);
        } else {
          fallbackStraightRoute();
        }
      })
      .catch(() => fallbackStraightRoute());

    function fallbackStraightRoute() {
      const coords = [[warehouse.lat, warehouse.lng], ...deliveryPoints.map(p => [p.lat, p.lng])];
      drawRoute(coords, "78.4", 145);
      startVehicleSimulation(coords);
    }

    function drawRoute(coords, distanceKm, durationMin) {
      activeRoutePath = coords;

      // Glow shadow
      L.polyline(coords, {
        color: '#0f172a', weight: 6, opacity: 0.25, lineCap: 'round', lineJoin: 'round'
      }).addTo(routeLayer);

      // Main road line
      L.polyline(coords, {
        color: '#2563eb', weight: 4.5, opacity: 0.9, lineCap: 'round', lineJoin: 'round'
      }).addTo(routeLayer);

      fitRouteBounds();
    }

    function fitRouteBounds() {
      if (activeRoutePath.length > 0) {
        map.fitBounds(L.latLngBounds(activeRoutePath), { padding: [50, 50], maxZoom: 14 });
      }
    }

    // 9. REAL-TIME GPS VEHICLE TRACKING SIMULATION
    let vehicleMarker = null;
    let pathIndex = 0;

    function startVehicleSimulation(coords) {
      if (coords.length === 0) return;

      const truckIcon = L.divIcon({
        className: 'truck-div-icon',
        html: `
          <div class="truck-marker" id="liveTruck" title="Reefer Truck #DL-9C">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="1" y="3" width="15" height="13"></rect>
              <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
              <circle cx="5.5" cy="18.5" r="2.5"></circle>
              <circle cx="18.5" cy="18.5" r="2.5"></circle>
            </svg>
          </div>
        `,
        iconSize: [36, 36], iconAnchor: [18, 18]
      });

      vehicleMarker = L.marker(coords[0], { icon: truckIcon })
        .bindPopup(`
          <div class="popup-title">Reefer Truck #DL-9C</div>
          <div class="popup-desc">Driver: Ramesh Yadav • In-Transit</div>
          <div class="popup-meta"><span><strong>Speed:</strong> 42 km/h</span><span><strong>Reefer:</strong> 3.8°C (Optimal)</span></div>
          <div class="popup-meta"><span><strong>Route:</strong> Central Hub → South Ext</span></div>
        `).addTo(vehicleLayer);

      // Smooth Animation along waypoints
      setInterval(() => {
        if (coords.length <= 1) return;
        pathIndex = (pathIndex + 1) % coords.length;
        const currentCoord = coords[pathIndex];
        const nextCoord = coords[(pathIndex + 1) % coords.length];

        vehicleMarker.setLatLng(currentCoord);

        // Calculate heading angle
        const angle = Math.atan2(nextCoord[1] - currentCoord[1], nextCoord[0] - currentCoord[0]) * 180 / Math.PI;
        const truckEl = document.getElementById('liveTruck');
        if (truckEl) {
          truckEl.style.transform = `rotate(${Math.round(angle)}deg)`;
        }

        // Vary speed slightly for realism
        const speed = 38 + Math.floor(Math.random() * 8);
        const speedEl = document.getElementById('speedDisplay');
        if (speedEl) speedEl.textContent = `${speed} km/h`;
      }, 900);
    }

    // 10. STATUS FILTER INTERACTION
    document.querySelectorAll('.stat-badge').forEach(badge => {
      badge.addEventListener('click', () => {
        const filter = badge.getAttribute('data-filter');
        const isSelected = badge.classList.toggle('selected');

        document.querySelectorAll('.stat-badge').forEach(b => {
          if (b !== badge) b.classList.remove('selected');
        });

        markerRegistry.forEach(({ point, marker, geofence }) => {
          if (!isSelected || point.status === filter) {
            map.addLayer(marker);
            map.addLayer(geofence);
          } else {
            map.removeLayer(marker);
            map.removeLayer(geofence);
          }
        });
      });
    });

    // 11. LAYER TOGGLES & RECENTER
    function wireToggle(btnId, badgeId, layer) {
      const btn = document.getElementById(btnId);
      const badge = document.getElementById(badgeId);
      btn.addEventListener('click', () => {
        const isActive = btn.classList.toggle('active');
        badge.textContent = isActive ? 'ON' : 'OFF';
        if (isActive) map.addLayer(layer);
        else map.removeLayer(layer);
      });
    }

    wireToggle('toggleWarehouse', 'badgeWarehouse', warehouseLayer);
    wireToggle('toggleDeliveries', 'badgeDeliveries', deliveriesLayer);
    wireToggle('toggleRoute', 'badgeRoute', routeLayer);
    document.getElementById('recenterBtn').addEventListener('click', fitRouteBounds);
  </script>
</body>
</html>
